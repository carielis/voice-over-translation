name: Build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: ["*"]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Node.js 🛎️
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Setup Bun.sh 🛎️
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install 🔧
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Check types
        run: bun run check
      - name: Lint
        run: bun run lint

  node:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }} 🛎️
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun.sh 🛎️
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install 🔧
        shell: bash
        run: bun install --frozen-lockfile
      - name: Build 🔧
        run: npm run build:gm
      - name: Upload Artifact 🚀
        uses: actions/upload-artifact@v7
        with:
          name: vot-${{ matrix.node-version }}
          path: dist/vot*.user.js

  extension:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }} 🛎️
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun.sh 🛎️
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install 🔧
        shell: bash
        run: bun install --frozen-lockfile
      - name: Build extension 🔧
        run: npm run build:ext
      - name: Upload extension artifacts 🚀
        uses: actions/upload-artifact@v7
        with:
          name: vot-extension-${{ matrix.node-version }}
          path: |
            dist-ext/vot-extension-chrome*.zip
            dist-ext/vot-extension-firefox*.xpi

  bun:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Bun.sh 🛎️
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install 🔧
        shell: bash
        run: bun install --frozen-lockfile
      - name: Build 🔧
        run: bun run build:gm
      - name: Upload Artifact 🚀
        uses: actions/upload-artifact@v7
        with:
          name: vot-bun
          path: dist/vot*.user.js
